<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กิจกรรมประจำวัน - ระบบธุรการชั้นเรียน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .act-tabs { display:flex; gap:0.5rem; margin-bottom:1rem; flex-wrap:wrap; }
    .act-tab { padding:0.5rem 1rem; border:2px solid #ddd; border-radius:20px; background:#fff; cursor:pointer; font-family:inherit; font-size:0.9rem; transition:all 0.15s; }
    .act-tab.active { border-color:#1a73e8; background:#e3f2fd; color:#1565c0; font-weight:600; }
    .act-cell { font-size:0.9rem; }
    .act-check { color:#2e7d32; font-weight:700; }
    .act-cross { color:#f44336; font-weight:700; }
    .act-none { color:#bbb; }
    .act-table th, .act-table td { text-align:center; white-space:nowrap; font-size:0.8rem; }
    .act-table td:nth-child(2) { text-align:left; min-width:140px; font-size:0.85rem; }
    .weekend-col { background:#fafafa; color:#bbb; }
    @media print { .app-header,.sidebar,.bottom-nav,.toolbar,#app-nav{display:none!important} .app-main{margin:0!important;padding:0!important} }
  </style>
  <link rel="stylesheet" href="/css/premium-theme.css">
  <link rel="stylesheet" href="/css/report.css">
</head>
<body class="app-body">
  <div id="app-nav"></div>
  <main class="app-main">
    <div class="container">
      <div class="page-header">
        <h2 class="page-title">กิจกรรมประจำวัน</h2>
        <button class="btn btn-outline" onclick="printReport()"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7.5 9V4.5a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1V9"/><rect class="f" x="3.5" y="9" width="17" height="8.5" rx="2.6"/><path d="M7.5 14h9v6.5h-9z"/></svg>พิมพ์ / PDF</button>
      </div>

      <p class="text-muted" style="font-size:0.875rem">ข้อมูลดึงมาจากการเช็คชื่ออัตโนมัติ — ✓ = มาเรียน (ทำกิจกรรม), ✗ = ไม่มา</p>

      <div id="alertBox"></div>

      <div class="toolbar card card-body mb-2" style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap">
        <div>
          <label class="form-label">ปี (ค.ศ.)</label>
          <input type="number" id="yearInput" class="form-input" style="width:100px">
        </div>
        <div>
          <label class="form-label">เดือน</label>
          <select id="monthInput" class="form-select" style="width:140px"></select>
        </div>
        <button class="btn btn-primary" onclick="loadActivities()">โหลด</button>
      </div>

      <div class="act-tabs">
        <button class="act-tab active" onclick="switchTab('นม', this)"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path class="f" d="M7 4h10l-1.2 15.2a1.8 1.8 0 0 1-1.8 1.6h-4a1.8 1.8 0 0 1-1.8-1.6z"/><path d="M7.6 9.5h8.8"/></svg>ดื่มนม</button>
        <button class="act-tab" onclick="switchTab('แปรงฟัน', this)"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path class="f" d="M12 6c-1-1-2.2-1.6-3.6-1.6C6.1 4.4 4.5 6.2 4.5 8.6c0 1.7.6 3 1.2 4.4.7 1.6.9 4 1.5 6.2.2.9 1.4.9 1.7 0 .4-1.4.6-3.2 1.2-3.8.5-.5 1.4-.5 1.8 0 .6.6.8 2.4 1.2 3.8.3.9 1.5.9 1.7 0 .6-2.2.8-4.6 1.5-6.2.6-1.4 1.2-2.7 1.2-4.4 0-2.4-1.6-4.2-3.9-4.2C14.200 4.4 13 5 12 6z"/></svg>แปรงฟัน</button>
        <button class="act-tab" onclick="switchTab('อาหาร', this)"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6.5 3.5v5.2a2.5 2.5 0 0 0 5 0V3.5M9 3.5v17"/><path d="M17.5 20.5v-17C15.300 4.700 14 7.300 14 10.500h3.500"/></svg>รับประทานอาหาร</button>
        <button class="act-tab" onclick="switchTab('ทำความสะอาด', this)"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path class="f" d="m11 3.5 1.8 5 5 1.8-5 1.8-1.8 5-1.8-5-5-1.8 5-1.8z"/><path d="m18.500 15.500.7 1.800 1.800.7-1.800.7-.7 1.800-.7-1.800-1.800-.7 1.800-.7z"/></svg>ทำความสะอาด</button>
      </div>

      <div id="actTitle" class="card-header mb-2" style="border-radius:8px 8px 0 0;background:#e3f2fd">กิจกรรม: ดื่มนม</div>

      <div style="overflow-x:auto">
        <table class="table act-table mb-0">
          <thead id="actHead"></thead>
          <tbody id="actTbody">
            <tr><td colspan="5" class="text-center text-muted py-4">กรุณาเลือกเดือนและกดโหลด</td></tr>
          </tbody>
        </table>
      </div>
      <div class="bottom-spacer"></div>
    </div>
  </main>

  <script type="module">
    import { checkAuth, getCurrentClassroom } from '/js/auth.js';
    import { api } from '/js/api.js';
    import { thaiMonth, daysInMonth, showAlert } from '/js/utils.js';
    import { initNav } from '/js/nav.js';
    import { openReport, getReportContext, esc, studentName, buddhistYear } from '/js/report.js';

    let classroom = null;
    let currentYear, currentMonth;
    let students = [];
    let attendanceMap = {}; // {day: {student_id: status}}
    let currentActivity = 'นม';

    async function init() {
      await checkAuth();
      classroom = getCurrentClassroom();
      if (!classroom) { alert('กรุณาเลือกห้องเรียน'); window.location.href = '/dashboard.html'; return; }
      initNav('activities');

      const now = new Date();
      currentYear = now.getFullYear();
      currentMonth = now.getMonth() + 1;
      document.getElementById('yearInput').value = currentYear;

      const monthSel = document.getElementById('monthInput');
      for (let m = 1; m <= 12; m++) {
        const opt = document.createElement('option');
        opt.value = m; opt.textContent = thaiMonth(m);
        if (m === currentMonth) opt.selected = true;
        monthSel.appendChild(opt);
      }

      buildHeader();
      loadActivities();
    }

    function buildHeader() {
      const days = daysInMonth(currentYear, currentMonth);
      const daysArr = Array.from({length: days}, (_, i) => i+1);

      function isWe(d) {
        const dt = new Date(currentYear, currentMonth-1, d);
        return dt.getDay() === 0 || dt.getDay() === 6;
      }

      document.getElementById('actHead').innerHTML = `
        <tr>
          <th>#</th>
          <th>ชื่อ-สกุล</th>
          ${daysArr.map(d => `<th class="${isWe(d)?'weekend-col':''}">${d}</th>`).join('')}
          <th>รวม</th>
        </tr>
      `;
    }

    window.loadActivities = async function() {
      currentYear = parseInt(document.getElementById('yearInput').value);
      currentMonth = parseInt(document.getElementById('monthInput').value);

      try {
        students = await api.getStudents(classroom.id);
        // Load attendance for each day of the month
        const days = daysInMonth(currentYear, currentMonth);
        attendanceMap = {};

        // Load month attendance summary
        const monthData = await api.getAttendanceByMonth(classroom.id, currentYear, currentMonth);

        // Also load daily data
        const promises = [];
        for (let d = 1; d <= days; d++) {
          const dateStr = `${currentYear}-${String(currentMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          promises.push(api.getAttendanceByDate(classroom.id, dateStr).then(data => ({ day: d, data })));
        }

        const results = await Promise.allSettled(promises);
        results.forEach(r => {
          if (r.status === 'fulfilled' && r.value) {
            const { day, data } = r.value;
            attendanceMap[day] = {};
            data.forEach(s => {
              attendanceMap[day][s.id || s.student_id] = s.status;
            });
          }
        });

        buildHeader();
        renderActivity();
      } catch (e) {
        showAlert(document.getElementById('alertBox'), 'โหลดไม่ได้: ' + e.message, 'danger');
      }
    };

    window.switchTab = function(activity, btn) {
      currentActivity = activity;
      document.querySelectorAll('.act-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const names = { 'นม': 'ดื่มนม', 'แปรงฟัน': 'แปรงฟัน', 'อาหาร': 'รับประทานอาหาร', 'ทำความสะอาด': 'ทำความสะอาด' };
      document.getElementById('actTitle').textContent = `กิจกรรม: ${names[activity] || activity}`;
      renderActivity();
    };

    function renderActivity() {
      const days = daysInMonth(currentYear, currentMonth);
      const daysArr = Array.from({length: days}, (_, i) => i+1);

      function isWe(d) {
        const dt = new Date(currentYear, currentMonth-1, d);
        return dt.getDay() === 0 || dt.getDay() === 6;
      }

      const tbody = document.getElementById('actTbody');
      tbody.innerHTML = students.map((s, i) => {
        let total = 0;
        const cells = daysArr.map(d => {
          if (isWe(d)) return `<td class="weekend-col">-</td>`;
          const status = attendanceMap[d]?.[s.id];
          if (!status) return `<td class="act-none act-cell">·</td>`;
          if (status === 'มา') { total++; return `<td class="act-check act-cell">✓</td>`; }
          return `<td class="act-cross act-cell">✗</td>`;
        }).join('');

        return `<tr>
          <td>${i+1}</td>
          <td>${s.prefix||''}${s.first_name} ${s.last_name}</td>
          ${cells}
          <td style="font-weight:700;color:#2e7d32">${total}</td>
        </tr>`;
      }).join('') || '<tr><td colspan="35" class="text-center text-muted py-4">ไม่มีข้อมูล</td></tr>';
    }

        function signatures(ctx) {
      return [
        { role: 'ครูประจำชั้น', name: ctx.teacherName },
        { role: 'ผู้อำนวยการ' + ctx.school.name, name: ctx.school.director },
      ];
    }

    window.printReport = async function() {
      if (!students.length) { showAlert(document.getElementById('alertBox'), 'ยังไม่มีข้อมูลให้พิมพ์ กรุณากดโหลดก่อน', 'warning'); return; }
      const ctx = await getReportContext();
      const names = { 'นม': 'ดื่มนม', 'แปรงฟัน': 'แปรงฟัน', 'อาหาร': 'รับประทานอาหาร', 'ทำความสะอาด': 'ทำความสะอาด' };
      const days = daysInMonth(currentYear, currentMonth);
      const daysArr = Array.from({ length: days }, (_, i) => i + 1);
      const isWe = d => { const g = new Date(currentYear, currentMonth - 1, d).getDay(); return g === 0 || g === 6; };
      const month = `${thaiMonth(currentMonth)} พ.ศ. ${buddhistYear(currentYear)}`;
      const mark = (s, d) => {
        if (isWe(d)) return '';
        const st = attendanceMap[d]?.[s.id];
        return !st ? '' : (st === 'มา' ? '/' : '×');
      };
      const totals = students.map(s => daysArr.filter(d => !isWe(d) && attendanceMap[d]?.[s.id] === 'มา').length);

      openReport({
        key: 'activity',
        title: `แบบบันทึกกิจกรรมประจำวัน: ${names[currentActivity] || currentActivity}`,
        subtitle: `ชั้น${classroom.level} ประจำเดือน${month}`,
        orientation: 'landscape',
        fileName: `กิจกรรม_${names[currentActivity] || currentActivity}_${classroom.level}_${thaiMonth(currentMonth)}${buddhistYear(currentYear)}`,
        info: [`จำนวนนักเรียน ${students.length} คน`],
        table: {
          cls: 'dense',
          colgroup: `<colgroup><col style="width:7mm"><col style="width:42mm">${daysArr.map(() => '<col>').join('')}<col style="width:12mm"></colgroup>`,
          head: `<tr><th>ที่</th><th>ชื่อ-สกุล</th>${daysArr.map(d => `<th class="${isWe(d) ? 'wk' : ''}">${d}</th>`).join('')}<th>รวม</th></tr>`,
          rows: students.map((s, i) => `<tr class="rpt-row"><td>${i + 1}</td><td class="l">${studentName(s)}</td>${daysArr.map(d => `<td class="${isWe(d) ? 'wk' : ''}">${mark(s, d)}</td>`).join('')}<td class="bold">${totals[i] || ''}</td></tr>`),
        },
        after: '<div class="rpt-note"><b>หมายเหตุ</b> เครื่องหมาย / = เข้าร่วมกิจกรรม (มาเรียน), × = ไม่เข้าร่วม, ช่องว่าง = ยังไม่บันทึก, ช่องแรเงา = วันเสาร์–วันอาทิตย์ (ดึงข้อมูลจากการเช็คชื่ออัตโนมัติ)</div>',
        signatures: signatures(ctx),
      });
    };

    init();
  </script>
</body>
</html>
