<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หน้าหลัก — ระบบธุรการชั้นเรียน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .classroom-selector {
      background: #fff;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 20px;
      display: none;
    }
    .classroom-selector label { font-size: 13px; font-weight: 700; color: #475569; margin-bottom: 8px; }

    .welcome-card {
      background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
      border-radius: 18px;
      padding: 24px 24px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      border: none;
    }
    .welcome-card::before {
      content: '';
      position: absolute;
      width: 200px; height: 200px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
      top: -60px; right: -40px;
    }
    .welcome-card::after {
      content: '';
      position: absolute;
      width: 120px; height: 120px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
      bottom: -30px; right: 100px;
    }
    .welcome-inner {
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px;
    }
    .welcome-inner h2 {
      font-size: 22px; font-weight: 800; color: #fff;
      margin-bottom: 4px;
    }
    .welcome-inner p { font-size: 14px; color: rgba(255,255,255,0.7); }
    .date-badge {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      backdrop-filter: blur(4px);
    }

    /* Stats */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    @media (min-width: 580px) { .stats-row { grid-template-columns: repeat(4, 1fr); } }

    .stat-box {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 18px 16px;
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: transform 150ms, box-shadow 150ms;
    }
    .stat-box:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    .stat-box::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      border-radius: 0 0 16px 16px;
    }
    .stat-box.s-blue::after   { background: #2563eb; }
    .stat-box.s-green::after  { background: #16a34a; }
    .stat-box.s-red::after    { background: #dc2626; }
    .stat-box.s-orange::after { background: #d97706; }

    .stat-emoji { font-size: 26px; margin-bottom: 8px; display: block; }
    .stat-num {
      font-size: 32px; font-weight: 800; line-height: 1;
      margin-bottom: 4px;
    }
    .stat-box.s-blue .stat-num   { color: #2563eb; }
    .stat-box.s-green .stat-num  { color: #16a34a; }
    .stat-box.s-red .stat-num    { color: #dc2626; }
    .stat-box.s-orange .stat-num { color: #d97706; }
    .stat-name { font-size: 12px; color: #94a3b8; font-weight: 600; }

    /* Menu grid */
    .menu-label {
      font-size: 13px; font-weight: 700;
      color: #64748b; letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    @media (min-width: 480px) { .menu-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 768px) { .menu-grid { grid-template-columns: repeat(4, 1fr); } }

    .menu-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 22px 12px 18px;
      text-align: center;
      text-decoration: none;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      transition: all 150ms;
      cursor: pointer;
    }
    .menu-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(37,99,235,0.1);
      border-color: #bfdbfe;
      text-decoration: none;
    }
    .menu-card-icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      transition: transform 150ms;
    }
    .menu-card:hover .menu-card-icon { transform: scale(1.1); }
    .ic-blue   { background: #eff6ff; }
    .ic-green  { background: #f0fdf4; }
    .ic-orange { background: #fffbeb; }
    .ic-purple { background: #f5f3ff; }
    .ic-red    { background: #fef2f2; }
    .ic-teal   { background: #f0fdfa; }
    .ic-pink   { background: #fdf4ff; }
    .ic-sky    { background: #f0f9ff; }

    .menu-card-label {
      font-size: 13px; font-weight: 700;
      color: #1e293b; line-height: 1.3;
    }

    /* Attendance table */
    .att-section {
      display: none;
    }
    .att-status {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px; font-weight: 700;
    }
    .att-มา  { background: #f0fdf4; color: #16a34a; }
    .att-ป   { background: #fffbeb; color: #d97706; }
    .att-ล   { background: #eff6ff; color: #2563eb; }
    .att-ข   { background: #fef2f2; color: #dc2626; }
    .att-none { background: #f8fafc; color: #94a3b8; }
  </style>
  <link rel="stylesheet" href="/css/premium-theme.css">
</head>
<body class="app-body">
  <div id="app-nav"></div>
  <main class="app-main">
    <div class="container">

      <!-- Classroom selector (admin) -->
      <div id="classroomSelector" class="classroom-selector">
        <label>เลือกห้องเรียน</label>
        <select id="classroomSelect" class="form-select" onchange="onClassroomChange()"></select>
      </div>

      <!-- Welcome banner -->
      <div class="welcome-card">
        <div class="welcome-inner">
          <div>
            <h2 id="welcomeTitle">ยินดีต้อนรับ</h2>
            <p id="welcomeSubtitle">กรุณาเลือกห้องเรียน</p>
          </div>
          <div id="todayDate" class="date-badge">—</div>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-box s-blue">
          <span class="stat-emoji"><svg class="ic" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle class="f" cx="9" cy="8.5" r="3.3"/><path d="M3.2 19.5c.5-3.1 2.7-5 5.8-5s5.3 1.9 5.8 5"/><path d="M15.5 5.6a3.1 3.1 0 0 1 0 5.8M17.5 14.9c1.9.5 3.1 2 3.4 4.3"/></svg></span>
          <div class="stat-num" id="statStudents">—</div>
          <div class="stat-name">นักเรียนทั้งหมด</div>
        </div>
        <div class="stat-box s-green">
          <span class="stat-emoji"><svg class="ic" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle class="f" cx="12" cy="12" r="8.5"/><path d="m8.4 12.3 2.6 2.6 4.6-5.2"/></svg></span>
          <div class="stat-num" id="statPresent">—</div>
          <div class="stat-name">มาวันนี้</div>
        </div>
        <div class="stat-box s-red">
          <span class="stat-emoji"><svg class="ic" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle class="f" cx="12" cy="12" r="8.5"/><path d="m9.2 9.2 5.6 5.6M14.8 9.2l-5.6 5.6"/></svg></span>
          <div class="stat-num" id="statAbsent">—</div>
          <div class="stat-name">ขาด / ลา</div>
        </div>
        <div class="stat-box s-orange">
          <span class="stat-emoji"><svg class="ic" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle class="f" cx="12" cy="12" r="8.5"/><path d="M12 7.6V12l3 1.9"/></svg></span>
          <div class="stat-num" id="statNotChecked">—</div>
          <div class="stat-name">ยังไม่เช็ค</div>
        </div>
      </div>

      <!-- Main menu -->
      <div class="menu-label">เมนูหลัก</div>
      <div class="menu-grid">
        <a href="/attendance.html" class="menu-card">
          <div class="menu-card-icon ic-blue"><svg class="ic" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect class="f" x="5" y="4.5" width="14" height="16.5" rx="3.2"/><path d="M9 4.5V4a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 4v.5M8.8 11h6.4M8.8 15h4"/></svg></div>
          <div class="menu-card-label">เช็คชื่อ</div>
        </a>
        <a href="/savings.html" class="menu-card">
          <div class="menu-card-icon ic-green"><svg class="ic" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect class="f" x="3" y="6.5" width="18" height="11" rx="3.2"/><circle cx="12" cy="12" r="2.4"/><path d="M6.6 12h.01M17.4 12h.01"/></svg></div>
          <div class="menu-card-label">ออมเงิน</div>
        </a>
        <a href="/growth.html" class="menu-card">
          <div class="menu-card-icon ic-orange"><svg class="ic" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect class="f" x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M8.2 10a5.2 5.2 0 0 1 7.6 0"/><path d="m12 11.2 1.8-1.9"/></svg></div>
          <div class="menu-card-label">น้ำหนัก-ส่วนสูง</div>
        </a>
        <a href="/health-check.html" class="menu-card">
          <div class="menu-card-icon ic-red"><svg class="ic" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path class="f" d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
          <div class="menu-card-label">ตรวจสุขภาพ</div>
        </a>
        <a href="/activities.html" class="menu-card">
          <div class="menu-card-icon ic-teal"><svg class="ic" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect class="f" x="3.5" y="4" width="17" height="16" rx="4"/><path d="M8 9h8M8 12.5h8M8 16h4.5"/></svg></div>
          <div class="menu-card-label">กิจกรรมประจำวัน</div>
        </a>
        <a href="/attendance-report.html" class="menu-card">
          <div class="menu-card-icon ic-purple"><svg class="ic" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect class="f" x="4" y="11" width="4" height="9" rx="1.3"/><rect class="f" x="10" y="4" width="4" height="16" rx="1.3"/><rect class="f" x="16" y="8" width="4" height="12" rx="1.3"/></svg></div>
          <div class="menu-card-label">สรุปเวลาเรียน</div>
        </a>
        <a href="/students.html" class="menu-card">
          <div class="menu-card-icon ic-sky"><svg class="ic" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle class="f" cx="9" cy="8.5" r="3.3"/><path d="M3.2 19.5c.5-3.1 2.7-5 5.8-5s5.3 1.9 5.8 5"/><path d="M15.5 5.6a3.1 3.1 0 0 1 0 5.8M17.5 14.9c1.9.5 3.1 2 3.4 4.3"/></svg></div>
          <div class="menu-card-label">ข้อมูลนักเรียน</div>
        </a>
        <a href="/settings.html" class="menu-card">
          <div class="menu-card-icon ic-pink"><svg class="ic" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle class="f" cx="15" cy="7" r="2.2"/><circle class="f" cx="9" cy="17" r="2.2"/></svg></div>
          <div class="menu-card-label">ตั้งค่าระบบ</div>
        </a>
      </div>

      <!-- Today's attendance -->
      <div id="attSection" class="att-section">
        <div class="card">
          <div class="card-header">
            การมาเรียนวันนี้
          </div>
          <div class="table-wrap">
            <table class="table table-sm">
              <thead>
                <tr>
                  <th>#</th>
                  <th>ชื่อ-นามสกุล</th>
                  <th>สถานะ</th>
                  <th>หมายเหตุ</th>
                </tr>
              </thead>
              <tbody id="attendanceBody"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>
  <div class="bottom-spacer"></div>

  <script type="module">
    import { checkAuth, getCurrentClassroom, setCurrentClassroom, getUser, getClassrooms } from '/js/auth.js';
    import { api } from '/js/api.js';
    import { today, thaiMonth } from '/js/utils.js';
    import { initNav } from '/js/nav.js';

    let currentClassroom = null;

    async function init() {
      const data = await checkAuth();
      if (!data) return;

      currentClassroom = getCurrentClassroom();
      initNav('dashboard');

      const classrooms = getClassrooms();
      if (classrooms.length > 1) {
        const sel = document.getElementById('classroomSelect');
        classrooms.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.id;
          opt.textContent = `ชั้น ${c.level} ปีการศึกษา ${c.academic_year}${c.teacher_name ? ' — ' + c.teacher_name : ''}`;
          if (currentClassroom && c.id === currentClassroom.id) opt.selected = true;
          sel.appendChild(opt);
        });
        document.getElementById('classroomSelector').style.display = 'block';
      }

      updateWelcome();
      if (currentClassroom) loadStats();
    }

    function updateWelcome() {
      const user = getUser();
      const d = new Date();
      const thDate = `${d.getDate()} ${thaiMonth(d.getMonth()+1)} ${d.getFullYear()+543}`;
      document.getElementById('welcomeTitle').textContent = `สวัสดี, ${user.full_name || user.username}`;
      document.getElementById('welcomeSubtitle').textContent = currentClassroom
        ? `ชั้น ${currentClassroom.level} · ปีการศึกษา ${currentClassroom.academic_year}`
        : 'กรุณาเลือกห้องเรียนจากรายการด้านบน';
      document.getElementById('todayDate').textContent = thDate;
    }

    async function loadStats() {
      try {
        const [students, attendance] = await Promise.all([
          api.getStudents(currentClassroom.id),
          api.getAttendanceByDate(currentClassroom.id, today())
        ]);

        const statusList = attendance.map(a => a.status || null);
        const present = statusList.filter(s => s === 'มา').length;
        const absent  = statusList.filter(s => s === 'ข' || s === 'ล' || s === 'ป').length;
        const none    = statusList.filter(s => !s).length;

        document.getElementById('statStudents').textContent = students.length;
        document.getElementById('statPresent').textContent  = present;
        document.getElementById('statAbsent').textContent   = absent;
        document.getElementById('statNotChecked').textContent = none;

        const tbody = document.getElementById('attendanceBody');
        tbody.innerHTML = '';
        const statusLabel = { 'มา': '<svg class="ic" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle class="f" cx="12" cy="12" r="8.5"/><path d="m8.4 12.3 2.6 2.6 4.6-5.2"/></svg>มาเรียน', 'ป': '<svg class="ic" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path class="f" d="M10 14.6V5.6a2 2 0 0 1 4 0v9a4 4 0 1 1-4 0z"/><path d="M12 10v5.5"/></svg>ป่วย', 'ล': '<svg class="ic" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path class="f" d="M7 3.5h7l4.5 4.5v11A1.5 1.5 0 0 1 17 20.5H7A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.5z"/><path d="M14 3.5V8h4.5M9 13h6M9 16.5h4"/></svg>ลา', 'ข': '<svg class="ic" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle class="f" cx="12" cy="12" r="8.5"/><path d="m9.2 9.2 5.6 5.6M14.8 9.2l-5.6 5.6"/></svg>ขาด' };
        const statusClass = { 'มา': 'att-มา', 'ป': 'att-ป', 'ล': 'att-ล', 'ข': 'att-ข' };
        attendance.forEach((s, i) => {
          const tr = document.createElement('tr');
          const badge = s.status
            ? `<span class="att-status ${statusClass[s.status] || ''}">${statusLabel[s.status] || s.status}</span>`
            : `<span class="att-status att-none">ยังไม่เช็ค</span>`;
          tr.innerHTML = `
            <td style="color:#94a3b8;font-weight:600">${i+1}</td>
            <td style="font-weight:600">${s.prefix || ''}${s.first_name} ${s.last_name}</td>
            <td>${badge}</td>
            <td style="color:#94a3b8;font-size:13px">${s.note || '—'}</td>
          `;
          tbody.appendChild(tr);
        });
        document.getElementById('attSection').style.display = 'block';
      } catch(e) { console.error(e); }
    }

    window.onClassroomChange = function() {
      const classrooms = getClassrooms();
      const id = parseInt(document.getElementById('classroomSelect').value);
      currentClassroom = classrooms.find(c => c.id === id);
      setCurrentClassroom(id);
      sessionStorage.setItem('current_classroom', JSON.stringify(currentClassroom));
      updateWelcome();
      loadStats();
      initNav('dashboard');
    };

    init();
  </script>
</body>
</html>
