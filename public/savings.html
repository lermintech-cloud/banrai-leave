<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ออมเงิน - ระบบธุรการชั้นเรียน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .savings-input { width:60px; padding:0.25rem 0.4rem; border:1px solid #ddd; border-radius:5px; text-align:right; font-size:0.85rem; font-family:inherit; }
    .savings-input:focus { border-color:#1a73e8; outline:none; }
    .savings-table th, .savings-table td { font-size:0.78rem; white-space:nowrap; text-align:center; }
    .savings-table td:nth-child(2) { text-align:left; min-width:140px; font-size:0.85rem; }
    .weekend-col { background:#fafafa; }
    .total-col { background:#e8f5e9; font-weight:bold; }
    .ios-savings-list { display:grid; gap:12px; margin-top:12px; }
    .ios-savings-card { background:#fff; border:1px solid #e7eaf0; border-radius:18px; padding:15px; box-shadow:0 4px 18px rgba(20,35,60,.06); }
    .ios-savings-head { display:flex; justify-content:space-between; gap:10px; align-items:center; margin-bottom:12px; font-weight:700; }
    .ios-savings-total { color:#176b48; background:#eaf8f1; border-radius:999px; padding:5px 10px; font-size:.85rem; }
    .ios-savings-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }
    .ios-savings-day label { display:block; color:#7a8494; font-size:.72rem; margin-bottom:4px; }
    .ios-savings-day input { width:100%; min-width:0; height:42px; border:1px solid #dce2eb; border-radius:10px; text-align:center; font:inherit; font-size:16px; background:#f9fafc; padding:4px; }
    .ios-savings-day input:focus { outline:2px solid #9bbcf8; border-color:#477fe0; }
    .savings-desktop-table { display:block; }
    @media(max-width:767px) { .savings-desktop-table { display:none; } .ios-savings-list { padding-bottom:10px; } }
    @media(min-width:768px) { #savingsCards { display:none; } }
    @media print { .app-header,.sidebar,.bottom-nav,.toolbar,#app-nav,.save-bar{display:none!important} .app-main{margin:0!important;padding:0!important} }
  </style>
  <link rel="stylesheet" href="/css/premium-theme.css">
  <link rel="stylesheet" href="/css/report.css">
</head>
<body class="app-body">
  <div id="app-nav"></div>
  <main class="app-main">
    <div class="container">
      <div class="page-header">
        <h2 class="page-title">ออมเงิน</h2>
        <button class="btn btn-outline" onclick="printReport()"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7.5 9V4.5a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1V9"/><rect class="f" x="3.5" y="9" width="17" height="8.5" rx="2.6"/><path d="M7.5 14h9v6.5h-9z"/></svg>พิมพ์ / PDF</button>
      </div>

      <div id="alertBox"></div>

      <div class="toolbar card card-body mb-2" style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap">
        <div>
          <label class="form-label">ปี (ค.ศ.)</label>
          <input type="number" id="yearInput" class="form-input" style="width:100px">
        </div>
        <div>
          <label class="form-label">เดือน</label>
          <select id="monthInput" class="form-select" style="width:140px"></select>
        </div>
        <button class="btn btn-primary" onclick="loadSavings()">โหลด</button>
      </div>

      <div id="savingsCards" class="ios-savings-list"></div>
      <div class="savings-desktop-table" style="overflow-x:auto">
        <table class="table savings-table mb-0" id="savingsTable">
          <thead id="savingsHead"></thead>
          <tbody id="savingsTbody">
            <tr><td colspan="5" class="text-center text-muted py-4">กรุณาเลือกเดือนและกดโหลด</td></tr>
          </tbody>
          <tfoot id="savingsFoot"></tfoot>
        </table>
      </div>
      <div style="height:80px"></div>
    </div>
  </main>

  <div style="position:fixed;bottom:60px;left:0;right:0;padding:0.75rem 1rem;background:#fff;box-shadow:0 -2px 8px rgba(0,0,0,0.12);z-index:90">
    <button class="btn btn-primary" style="width:100%" onclick="saveSavings()"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 4v10.5M7.8 10.8l4.2 4.2 4.2-4.2"/><path d="M5 19.5h14"/></svg>บันทึกออมเงิน</button>
  </div>

  <script type="module">
    import { checkAuth, getCurrentClassroom } from '/js/auth.js';
    import { api } from '/js/api.js';
    import { thaiMonth, daysInMonth, showAlert } from '/js/utils.js';
    import { initNav } from '/js/nav.js';
    import { openReport, getReportContext, esc, studentName, buddhistYear } from '/js/report.js';

    let classroom = null;
    let currentYear, currentMonth;
    let students = [];
    let savingsMap = {}; // {student_id: {day: amount}}

    async function init() {
      await checkAuth();
      classroom = getCurrentClassroom();
      if (!classroom) { alert('กรุณาเลือกห้องเรียน'); window.location.href = '/dashboard.html'; return; }
      initNav('savings');

      const now = new Date();
      currentYear = now.getFullYear();
      currentMonth = now.getMonth() + 1;
      document.getElementById('yearInput').value = currentYear;

      const monthSel = document.getElementById('monthInput');
      for (let m = 1; m <= 12; m++) {
        const opt = document.createElement('option');
        opt.value = m; opt.textContent = thaiMonth(m);
        if (m === currentMonth) opt.selected = true;
        monthSel.appendChild(opt);
      }
      loadSavings();
    }

    window.loadSavings = async function() {
      currentYear = parseInt(document.getElementById('yearInput').value);
      currentMonth = parseInt(document.getElementById('monthInput').value);

      try {
        const [studentsData, savingsData] = await Promise.all([
          api.getStudents(classroom.id),
          api.getSavingsByMonth(classroom.id, currentYear, currentMonth)
        ]);

        students = studentsData;
        savingsMap = {};
        students.forEach(s => { savingsMap[s.id] = {}; });
        savingsData.forEach(r => {
          if (!r.date) return;
          const day = new Date(r.date).getDate();
          if (!savingsMap[r.student_id]) savingsMap[r.student_id] = {};
          savingsMap[r.student_id][day] = r.amount;
        });

        renderTable();
      } catch (e) {
        showAlert(document.getElementById('alertBox'), 'โหลดไม่ได้: ' + e.message, 'danger');
      }
    };

    function renderTable() {
      const days = daysInMonth(currentYear, currentMonth);
      const daysArr = Array.from({length: days}, (_, i) => i+1);

      // Check weekends
      function isWe(d) {
        const dt = new Date(currentYear, currentMonth-1, d);
        return dt.getDay() === 0 || dt.getDay() === 6;
      }

      // Header
      document.getElementById('savingsHead').innerHTML = `
        <tr>
          <th rowspan="2">#</th>
          <th rowspan="2">ชื่อ-สกุล</th>
          ${daysArr.map(d => `<th class="${isWe(d)?'weekend-col':''}">${d}</th>`).join('')}
          <th rowspan="2" class="total-col">รวม</th>
        </tr>
      `;

      // Body
      const tbody = document.getElementById('savingsTbody');
      tbody.innerHTML = students.map((s, i) => {
        const rowTotal = daysArr.reduce((sum, d) => sum + (savingsMap[s.id]?.[d] || 0), 0);
        return `<tr>
          <td>${i+1}</td>
          <td>${s.prefix||''}${s.first_name} ${s.last_name}</td>
          ${daysArr.map(d => `<td class="${isWe(d)?'weekend-col':''}">
            ${!isWe(d) ? `<input type="number" class="savings-input"
              id="sv-${s.id}-${d}" value="${savingsMap[s.id]?.[d] || ''}"
              min="0" step="1" oninput="updateTotal(${s.id})">` : '-'}
          </td>`).join('')}
          <td class="total-col" id="total-${s.id}">${rowTotal > 0 ? rowTotal.toFixed(0) : '-'}</td>
        </tr>`;
      }).join('') || '<tr><td colspan="35" class="text-center text-muted py-4">ไม่มีข้อมูล</td></tr>';

      // iOS-style student cards for phones; desktop table remains available.
      document.getElementById('savingsCards').innerHTML = students.map((s, i) => {
        const total = daysArr.reduce((sum,d) => sum + (savingsMap[s.id]?.[d] || 0), 0);
        return `<section class="ios-savings-card"><div class="ios-savings-head"><span>${i+1}. ${s.prefix||''}${s.first_name} ${s.last_name}</span><span class="ios-savings-total" id="card-total-${s.id}">รวม ${total.toLocaleString('th-TH')} บาท</span></div><div class="ios-savings-grid">${daysArr.map(d => {
          const dt = new Date(currentYear,currentMonth-1,d); const weekend = dt.getDay()===0 || dt.getDay()===6;
          return `<div class="ios-savings-day"><label>${d}${weekend?' · หยุด':''}</label>${weekend?'<div style="height:42px;display:grid;place-items:center;color:#aab1bc">—</div>':`<input type="number" inputmode="decimal" min="0" step="1" aria-label="วันที่ ${d}" value="${savingsMap[s.id]?.[d] ?? ''}" id="sv-card-${s.id}-${d}" oninput="syncSavings(${s.id},${d},this.value)">`}</div>`;
        }).join('')}</div></section>`;
      }).join('');

      // Footer (daily totals)
      const foot = document.getElementById('savingsFoot');
      foot.innerHTML = `<tr>
        <td colspan="2" style="text-align:right;font-weight:600">รวมรายวัน</td>
        ${daysArr.map(d => {
          const dayTotal = students.reduce((sum, s) => {
            const inp = document.getElementById(`sv-${s.id}-${d}`);
            return sum + parseFloat(inp?.value || 0);
          }, 0);
          return `<td class="${isWe(d)?'weekend-col':''}" id="daytotal-${d}" style="font-weight:600">${isWe(d)?'-':(dayTotal>0?dayTotal.toFixed(0):'-')}</td>`;
        }).join('')}
        <td class="total-col" id="grandTotal" style="font-weight:700">${students.reduce((sum, s) =>
          sum + daysArr.reduce((s2, d) => s2 + (savingsMap[s.id]?.[d] || 0), 0), 0).toFixed(0)}</td>
      </tr>`;
    }

    window.syncSavings = function(sid, day, value) {
      const desktop = document.getElementById(`sv-${sid}-${day}`); if (desktop) desktop.value = value;
      window.updateTotal(sid);
    };

    window.updateTotal = function(sid) {
      const days = daysInMonth(currentYear, currentMonth);
      let total = 0;
      for (let d = 1; d <= days; d++) {
        const inp = document.getElementById(`sv-${sid}-${d}`);
        if (inp) total += parseFloat(inp.value) || 0;
      }
      const el = document.getElementById(`total-${sid}`);
      if (el) el.textContent = total > 0 ? total.toFixed(0) : '-';
      const cardTotal = document.getElementById(`card-total-${sid}`); if (cardTotal) cardTotal.textContent = `รวม ${total.toLocaleString('th-TH')} บาท`;
      let grand = 0;
      students.forEach(st => { for (let d=1; d<=days; d++) grand += parseFloat(document.getElementById(`sv-${st.id}-${d}`)?.value || 0) || 0; });
      const grandEl = document.getElementById('grandTotal'); if (grandEl) grandEl.textContent = grand.toFixed(0);
      for (let d=1; d<=days; d++) {
        const dayTotal = students.reduce((sum, st) => sum + (parseFloat(document.getElementById(`sv-${st.id}-${d}`)?.value || 0) || 0), 0);
        const dayEl = document.getElementById(`daytotal-${d}`); if (dayEl) dayEl.textContent = dayTotal > 0 ? dayTotal.toFixed(0) : '-';
      }
    };

    window.saveSavings = async function() {
      const days = daysInMonth(currentYear, currentMonth);
      const records = [];

      students.forEach(s => {
        for (let d = 1; d <= days; d++) {
          const inp = document.getElementById(`sv-${s.id}-${d}`);
          if (inp) {
            const dateStr = `${currentYear}-${String(currentMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            records.push({ student_id: s.id, amount: inp.value === '' ? null : (parseFloat(inp.value) || 0), date: dateStr });
          }
        }
      });

      // group by date for the API
      const byDate = {};
      records.forEach(r => {
        if (!byDate[r.date]) byDate[r.date] = [];
        byDate[r.date].push({ student_id: r.student_id, amount: r.amount });
      });

      try {
        for (const [date, recs] of Object.entries(byDate)) {
          await api.saveSavings(classroom.id, date, recs);
        }
        showAlert(document.getElementById('alertBox'), 'บันทึกออมเงินสำเร็จ', 'success');
      } catch (e) {
        showAlert(document.getElementById('alertBox'), 'บันทึกไม่สำเร็จ: ' + e.message, 'danger');
      }
    };

        function signatures(ctx) {
      return [
        { role: 'ครูประจำชั้น', name: ctx.teacherName },
        { role: 'ผู้อำนวยการ' + ctx.school.name, name: ctx.school.director },
      ];
    }

    window.printReport = async function() {
      if (!students.length) { showAlert(document.getElementById('alertBox'), 'ยังไม่มีข้อมูลให้พิมพ์ กรุณากดโหลดก่อน', 'warning'); return; }
      const ctx = await getReportContext();
      const days = daysInMonth(currentYear, currentMonth);
      const daysArr = Array.from({ length: days }, (_, i) => i + 1);
      const isWe = d => { const g = new Date(currentYear, currentMonth - 1, d).getDay(); return g === 0 || g === 6; };
      const amt = (sid, d) => parseFloat(document.getElementById(`sv-${sid}-${d}`)?.value) || 0;
      const dayTot = daysArr.map(d => students.reduce((a, s) => a + amt(s.id, d), 0));
      const rowTot = students.map(s => daysArr.reduce((a, d) => a + amt(s.id, d), 0));
      const grand = rowTot.reduce((a, b) => a + b, 0);
      const n = v => v > 0 ? v.toLocaleString('en-US', { maximumFractionDigits: 0 }) : '';
      const month = `${thaiMonth(currentMonth)} พ.ศ. ${buddhistYear(currentYear)}`;

      openReport({
        key: 'savings',
        title: 'บัญชีการออมทรัพย์ของนักเรียน',
        subtitle: `ชั้น${classroom.level} ประจำเดือน${month}`,
        orientation: 'landscape',
        fileName: `ออมเงิน_${classroom.level}_${thaiMonth(currentMonth)}${buddhistYear(currentYear)}`,
        info: [`จำนวนนักเรียน ${students.length} คน`, 'หน่วย: บาท'],
        table: {
          cls: 'dense',
          colgroup: `<colgroup><col style="width:7mm"><col style="width:42mm">${daysArr.map(() => '<col>').join('')}<col style="width:14mm"></colgroup>`,
          head: `<tr><th>ที่</th><th>ชื่อ-สกุล</th>${daysArr.map(d => `<th class="${isWe(d) ? 'wk' : ''}">${d}</th>`).join('')}<th>รวม</th></tr>`,
          rows: [
            ...students.map((s, i) => `<tr class="rpt-row"><td>${i + 1}</td><td class="l">${studentName(s)}</td>${daysArr.map(d => `<td class="${isWe(d) ? 'wk' : ''}">${isWe(d) ? '' : n(amt(s.id, d))}</td>`).join('')}<td class="bold">${n(rowTot[i])}</td></tr>`),
            `<tr class="rpt-row"><td class="tot l" colspan="2">รวมรายวัน</td>${daysArr.map((d, k) => `<td class="tot ${isWe(d) ? 'wk' : ''}">${isWe(d) ? '' : n(dayTot[k])}</td>`).join('')}<td class="tot">${n(grand)}</td></tr>`,
          ],
        },
        after: `<div class="rpt-summary"><b>ยอดออมรวมประจำเดือน</b> ${grand.toLocaleString('en-US')} บาท</div><div class="rpt-note">ช่องแรเงา คือ วันเสาร์–วันอาทิตย์ (ไม่มีการรับฝาก)</div>`,
        signatures: signatures(ctx),
      });
    };

    init();
  </script>
</body>
</html>
