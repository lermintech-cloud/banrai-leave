<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>น้ำหนัก-ส่วนสูง - ระบบธุรการชั้นเรียน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .growth-input { width: 70px; padding: 0.3rem 0.5rem; border: 1px solid #ddd; border-radius: 6px; text-align: center; font-size: 0.9rem; font-family: inherit; }
    .growth-input:focus { border-color: #1a73e8; outline: none; }
    .ios-student-list { display:grid; gap:12px; margin-top:12px; }
    .ios-student-card { background:#fff; border:1px solid #e7eaf0; border-radius:18px; padding:16px; box-shadow:0 4px 18px rgba(20,35,60,.06); }
    .ios-student-head { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:14px; }
    .ios-student-name { font-weight:700; color:#17233d; }
    .ios-student-meta { color:#7b8495; font-size:.82rem; }
    .ios-field-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .ios-field label { display:block; color:#687386; font-size:.82rem; margin-bottom:6px; }
    .ios-field input { width:100%; min-height:48px; border:1px solid #dce2eb; border-radius:12px; padding:10px 12px; font:inherit; font-size:16px; background:#f9fafc; }
    .ios-field input:focus { outline:2px solid #9bbcf8; border-color:#477fe0; background:#fff; }
    .growth-desktop-table { display:block; }
    @media(max-width:767px) { .growth-desktop-table { display:none; } .ios-student-list { padding-bottom:12px; } }
    @media(min-width:768px) { #growthCards { display:none; } }
    .nutrition-badge { font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 10px; white-space: nowrap; }
    .n-สมส่วน { background:#e8f5e9; color:#2e7d32; }
    .n-ค่อนข้างผอม { background:#fff8e1; color:#f57f17; }
    .n-ผอม { background:#ffeaea; color:#c62828; }
    .n-ท้วม { background:#e3f2fd; color:#1565c0; }
    .n-เริ่มอ้วน { background:#fff3e0; color:#e65100; }
    .n-อ้วน { background:#fce4ec; color:#880e4f; }
    @media print { .app-header,.sidebar,.bottom-nav,.toolbar,#app-nav,.save-bar{display:none!important} .app-main{margin:0!important;padding:0!important} }
  </style>
  <link rel="stylesheet" href="/css/premium-theme.css">
  <link rel="stylesheet" href="/css/report.css">
</head>
<body class="app-body">
  <div id="app-nav"></div>
  <main class="app-main">
    <div class="container">
      <div class="page-header">
        <h2 class="page-title">น้ำหนัก-ส่วนสูง</h2>
        <button class="btn btn-outline" onclick="printReport()"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7.5 9V4.5a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1V9"/><rect class="f" x="3.5" y="9" width="17" height="8.5" rx="2.6"/><path d="M7.5 14h9v6.5h-9z"/></svg>พิมพ์ / PDF</button>
      </div>

      <div id="alertBox"></div>

      <div class="toolbar card card-body mb-2" style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap">
        <div>
          <label class="form-label">ปี (ค.ศ.)</label>
          <input type="number" id="yearInput" class="form-input" style="width:100px" min="2024" max="2035">
        </div>
        <div>
          <label class="form-label">เดือน</label>
          <select id="monthInput" class="form-select" style="width:140px"></select>
        </div>
        <button class="btn btn-primary" onclick="loadGrowth()">โหลด</button>
      </div>

      <div id="growthCards" class="ios-student-list"></div>
      <div class="card growth-desktop-table">
        <div class="card-body p-0" style="overflow-x:auto">
          <table class="table mb-0" id="growthTable">
            <thead>
              <tr>
                <th>#</th>
                <th>ชื่อ-สกุล</th>
                <th>เพศ</th>
                <th>น้ำหนัก (กก.)</th>
                <th>ส่วนสูง (ซม.)</th>
                <th>ภาวะโภชนาการ</th>
                <th>หมายเหตุ</th>
              </tr>
            </thead>
            <tbody id="growthTbody">
              <tr><td colspan="7" class="text-center text-muted py-4">กรุณาเลือกเดือนและกดโหลด</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div style="height:80px"></div>
    </div>
  </main>

  <div class="save-bar" style="position:fixed;bottom:60px;left:0;right:0;padding:0.75rem 1rem;background:#fff;box-shadow:0 -2px 8px rgba(0,0,0,0.12);z-index:90">
    <button class="btn btn-primary" style="width:100%" onclick="saveGrowth()"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 4v10.5M7.8 10.8l4.2 4.2 4.2-4.2"/><path d="M5 19.5h14"/></svg>บันทึกน้ำหนัก-ส่วนสูง</button>
  </div>

  <script type="module">
    import { checkAuth, getCurrentClassroom } from '/js/auth.js';
    import { api } from '/js/api.js';
    import { thaiMonth, showAlert } from '/js/utils.js';
    import { initNav } from '/js/nav.js';
    import { openReport, getReportContext, esc, studentName, buddhistYear } from '/js/report.js';

    let classroom = null;
    let currentYear = null, currentMonth = null;
    let growthData = [];

    async function init() {
      await checkAuth();
      classroom = getCurrentClassroom();
      if (!classroom) { alert('กรุณาเลือกห้องเรียน'); window.location.href = '/dashboard.html'; return; }
      initNav('growth');

      const now = new Date();
      currentYear = now.getFullYear();
      currentMonth = now.getMonth() + 1;

      document.getElementById('yearInput').value = currentYear;
      const monthSel = document.getElementById('monthInput');
      for (let m = 1; m <= 12; m++) {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = thaiMonth(m);
        if (m === currentMonth) opt.selected = true;
        monthSel.appendChild(opt);
      }

      loadGrowth();
    }

    window.loadGrowth = async function() {
      currentYear = parseInt(document.getElementById('yearInput').value);
      currentMonth = parseInt(document.getElementById('monthInput').value);

      try {
        growthData = await api.getGrowth(classroom.id, currentYear, currentMonth);
        renderTable();
      } catch (e) {
        showAlert(document.getElementById('alertBox'), 'โหลดไม่ได้: ' + e.message, 'danger');
      }
    };

    function nutritionClass(status) {
      return 'n-' + (status || '-').replace(/\s/g, '');
    }

    function renderTable() {
      const tbody = document.getElementById('growthTbody');
      const cardList = document.getElementById('growthCards');
      cardList.innerHTML = growthData.map((s, i) => `
        <section class="ios-student-card">
          <div class="ios-student-head"><div><div class="ios-student-name">${i+1}. ${s.prefix||''}${s.first_name} ${s.last_name}</div><div class="ios-student-meta">เลขที่ ${s.student_number || '-'} · ${s.gender || '-'}</div></div><span class="nutrition-badge ${nutritionClass(s.nutrition_status)}">${s.nutrition_status || 'รอบันทึก'}</span></div>
          <div class="ios-field-grid">
            <div class="ios-field"><label for="w-card-${s.student_id}">น้ำหนัก (กก.)</label><input type="number" inputmode="decimal" id="w-card-${s.student_id}" value="${s.weight ?? ''}" step="0.1" min="0" max="200" placeholder="เช่น 25.5" oninput="syncGrowth(${s.student_id}, 'w', this.value)"></div>
            <div class="ios-field"><label for="h-card-${s.student_id}">ส่วนสูง (ซม.)</label><input type="number" inputmode="decimal" id="h-card-${s.student_id}" value="${s.height ?? ''}" step="0.1" min="0" max="250" placeholder="เช่น 125" oninput="syncGrowth(${s.student_id}, 'h', this.value)"></div>
            <div class="ios-field" style="grid-column:1/-1"><label for="note-card-${s.student_id}">หมายเหตุ</label><input type="text" id="note-card-${s.student_id}" value="${String(s.note||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}" placeholder="บันทึกเพิ่มเติม" oninput="syncGrowth(${s.student_id}, 'note', this.value)"></div>
          </div>
        </section>`).join('');
      tbody.innerHTML = growthData.map((s, i) => `
        <tr id="grow-${s.student_id}">
          <td>${i+1}</td>
          <td>${s.prefix||''}${s.first_name} ${s.last_name}</td>
          <td>${s.gender || '-'}</td>
          <td><input type="number" class="growth-input" id="w-${s.student_id}" value="${s.weight || ''}" step="0.1" min="0" max="200" placeholder="กก." oninput="clearNutrition(${s.student_id})"></td>
          <td><input type="number" class="growth-input" id="h-${s.student_id}" value="${s.height || ''}" step="1" min="0" max="250" placeholder="ซม." oninput="clearNutrition(${s.student_id})"></td>
          <td id="nut-${s.student_id}"><span class="nutrition-badge ${nutritionClass(s.nutrition_status)}">${s.nutrition_status || '-'}</span></td>
          <td><input type="text" class="form-input" style="width:100px;font-size:0.85rem;padding:0.3rem 0.5rem" id="note-${s.student_id}" value="${s.note || ''}" placeholder="หมายเหตุ"></td>
        </tr>
      `).join('') || '<tr><td colspan="7" class="text-center text-muted py-4">ไม่มีข้อมูล</td></tr>';
    }

    window.syncGrowth = function(sid, field, value) {
      const map = { w: `w-${sid}`, h: `h-${sid}`, note: `note-${sid}` };
      const target = document.getElementById(map[field]); if (target) target.value = value;
      if (field !== 'note') window.clearNutrition(sid);
    };

    window.clearNutrition = function(sid) {
      document.getElementById(`nut-${sid}`).innerHTML = '<span class="nutrition-badge">รอบันทึก</span>';
    };

    window.saveGrowth = async function() {
      const records = growthData.map(s => ({
        student_id: s.student_id,
        weight: parseFloat(document.getElementById(`w-${s.student_id}`)?.value) || null,
        height: parseInt(document.getElementById(`h-${s.student_id}`)?.value) || null,
        note: document.getElementById(`note-${s.student_id}`)?.value || null,
      }));

      try {
        await api.saveGrowth(classroom.id, currentYear, currentMonth, records);
        showAlert(document.getElementById('alertBox'), 'บันทึกน้ำหนัก-ส่วนสูงสำเร็จ', 'success');
        loadGrowth(); // reload to get updated nutrition status
      } catch (e) {
        showAlert(document.getElementById('alertBox'), 'บันทึกไม่สำเร็จ: ' + e.message, 'danger');
      }
    };

        function signatures(ctx) {
      return [
        { role: 'ครูประจำชั้น', name: ctx.teacherName },
        { role: 'ผู้อำนวยการ' + ctx.school.name, name: ctx.school.director },
      ];
    }

    window.printReport = async function() {
      if (!growthData.length) { showAlert(document.getElementById('alertBox'), 'ยังไม่มีข้อมูลให้พิมพ์ กรุณากดโหลดก่อน', 'warning'); return; }
      const ctx = await getReportContext();
      // ใช้ค่าที่กรอกอยู่บนจอ; ภาวะโภชนาการแสดงเฉพาะเมื่อค่าตรงกับที่บันทึกไว้แล้ว
      const list = growthData.map(s => {
        const w = parseFloat(document.getElementById(`w-${s.student_id}`)?.value) || null;
        const h = parseInt(document.getElementById(`h-${s.student_id}`)?.value) || null;
        const note = document.getElementById(`note-${s.student_id}`)?.value || '';
        const same = (w || null) === (s.weight || null) && (h || null) === (s.height || null);
        return { s, w, h, note, nut: same ? (s.nutrition_status || '-') : 'ยังไม่บันทึก' };
      });
      const order = ['ผอม', 'ค่อนข้างผอม', 'สมส่วน', 'ท้วม', 'เริ่มอ้วน', 'อ้วน'];
      const count = {}; list.forEach(r => { count[r.nut] = (count[r.nut] || 0) + 1; });
      const summary = order.filter(k => count[k]).map(k => `${k} ${count[k]} คน`).join(' · ') || 'ยังไม่มีข้อมูลภาวะโภชนาการ';
      const fmt = (v, d) => v ? Number(v).toFixed(d) : '-';
      const month = `${thaiMonth(currentMonth)} พ.ศ. ${buddhistYear(currentYear)}`;

      openReport({
        key: 'growth',
        title: 'บันทึกน้ำหนัก–ส่วนสูงและภาวะโภชนาการของนักเรียน',
        subtitle: `ชั้น${classroom.level} ประจำเดือน${month}`,
        orientation: 'portrait',
        fileName: `น้ำหนักส่วนสูง_${classroom.level}_${thaiMonth(currentMonth)}${buddhistYear(currentYear)}`,
        info: [`จำนวนนักเรียน ${list.length} คน`],
        table: {
          colgroup: '<colgroup><col style="width:9mm"><col><col style="width:14mm"><col style="width:18mm"><col style="width:18mm"><col style="width:28mm"><col style="width:26mm"></colgroup>',
          head: '<tr><th>ที่</th><th>ชื่อ-สกุล</th><th>เพศ</th><th>น้ำหนัก<br>(กก.)</th><th>ส่วนสูง<br>(ซม.)</th><th>ภาวะโภชนาการ</th><th>หมายเหตุ</th></tr>',
          rows: list.map((r, i) => `<tr class="rpt-row"><td>${i + 1}</td><td class="l">${studentName(r.s)}</td><td>${esc(r.s.gender || '-')}</td><td>${fmt(r.w, 1)}</td><td>${fmt(r.h, 0)}</td><td>${esc(r.nut)}</td><td class="l">${esc(r.note)}</td></tr>`),
        },
        after: `<div class="rpt-summary"><b>สรุป</b> ${esc(summary)}</div>`,
        signatures: signatures(ctx),
      });
    };

    init();
  </script>
</body>
</html>
