<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตรวจสุขภาพ - ระบบธุรการชั้นเรียน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .ios-health-list { display:grid; gap:12px; margin-top:12px; }
    .ios-health-card { background:#fff; border:1px solid #e7eaf0; border-radius:18px; padding:15px; box-shadow:0 4px 18px rgba(20,35,60,.06); }
    .ios-health-title { font-weight:700; color:#17233d; margin-bottom:12px; }
    .ios-health-item { padding:10px 0; border-top:1px solid #f0f2f6; }
    .ios-health-item label { display:block; color:#687386; font-size:.84rem; margin-bottom:7px; }
    .ios-health-options { display:flex; flex-wrap:wrap; gap:7px; }
    .ios-health-options button { border:1px solid #dce2eb; background:#f8f9fc; border-radius:999px; padding:9px 13px; min-height:40px; font:inherit; font-size:.85rem; color:#596579; }
    .ios-health-options button.active { background:#e9f1ff; border-color:#4b82df; color:#2059b4; font-weight:700; }
    .health-desktop-table { display:block; }
    @media(max-width:767px) { .health-desktop-table { display:none; } }
    @media(min-width:768px) { #healthCards { display:none; } }
    .health-select { padding:0.25rem 0.4rem; border:1px solid #ddd; border-radius:5px; font-size:0.8rem; font-family:inherit; min-width:90px; }
    .health-select:focus { border-color:#1a73e8; outline:none; }
    .health-table th { font-size:0.78rem; white-space:nowrap; vertical-align:middle; text-align:center; background:#f8f9fa; }
    .health-table td { font-size:0.85rem; vertical-align:middle; text-align:center; }
    .health-table td:nth-child(2) { text-align:left; min-width:140px; }
    @media print { .app-header,.sidebar,.bottom-nav,.toolbar,#app-nav,.save-bar{display:none!important} .app-main{margin:0!important;padding:0!important} }
  </style>
  <link rel="stylesheet" href="/css/premium-theme.css">
  <link rel="stylesheet" href="/css/report.css">
</head>
<body class="app-body">
  <div id="app-nav"></div>
  <main class="app-main">
    <div class="container">
      <div class="page-header">
        <h2 class="page-title">ตรวจสุขภาพนักเรียน</h2>
        <button class="btn btn-outline" onclick="printReport()"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7.5 9V4.5a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1V9"/><rect class="f" x="3.5" y="9" width="17" height="8.5" rx="2.6"/><path d="M7.5 14h9v6.5h-9z"/></svg>พิมพ์ / PDF</button>
      </div>

      <div id="alertBox"></div>

      <div class="toolbar card card-body mb-2" style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap">
        <div>
          <label class="form-label">ปี (ค.ศ.)</label>
          <input type="number" id="yearInput" class="form-input" style="width:100px">
        </div>
        <div>
          <label class="form-label">เดือน</label>
          <select id="monthInput" class="form-select" style="width:140px"></select>
        </div>
        <button class="btn btn-primary" onclick="loadHealthChecks()">โหลด</button>
      </div>

      <div id="healthCards" class="ios-health-list"></div>
      <div class="health-desktop-table" style="overflow-x:auto">
        <table class="table health-table mb-0" id="healthTable">
          <thead id="healthHead"></thead>
          <tbody id="healthTbody">
            <tr><td colspan="12" class="text-center text-muted py-4">กรุณาเลือกเดือนและกดโหลด</td></tr>
          </tbody>
        </table>
      </div>

      <div style="height:80px"></div>
    </div>
  </main>

  <div style="position:fixed;bottom:60px;left:0;right:0;padding:0.75rem 1rem;background:#fff;box-shadow:0 -2px 8px rgba(0,0,0,0.12);z-index:90">
    <button class="btn btn-primary" style="width:100%" onclick="saveHealthChecks()"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 4v10.5M7.8 10.8l4.2 4.2 4.2-4.2"/><path d="M5 19.5h14"/></svg>บันทึกผลตรวจสุขภาพ</button>
  </div>

  <script type="module">
    import { checkAuth, getCurrentClassroom } from '/js/auth.js';
    import { api } from '/js/api.js';
    import { thaiMonth, showAlert } from '/js/utils.js';
    import { initNav } from '/js/nav.js';
    import { openReport, getReportContext, esc, studentName, buddhistYear } from '/js/report.js';

    const HEALTH_OPTIONS = {
      'ผม/ศีรษะ': ['สะอาด','ไม่สะอาด'],
      'ตา': ['ปกติ','มีขี้ตา','ตาแดง','มีการอักเสบ','อื่น ๆ'],
      'ปาก': ['สะอาด','มีกลิ่นปาก','มีแผลในปาก','มีตุ่มในปาก'],
      'ฟัน': ['สะอาด','ฟันผุ','ไม่สะอาด'],
      'หู': ['สะอาด','ไม่สะอาด'],
      'จมูก': ['ปกติ','มีน้ำมูก','มีการอักเสบ'],
      'เล็บมือ/เล็บเท้า': ['สะอาด','ไม่สะอาด'],
      'ผิวหนัง': ['ปกติ','ผื่น','แผล','อื่น ๆ'],
      'ฝ่ามือ/ฝ่าเท้า': ['ปกติ','แห้งแตก','ผื่น']
    };
    const ITEMS = Object.keys(HEALTH_OPTIONS);

    let classroom = null;
    let currentYear = null, currentMonth = null;
    let students = [];

    async function init() {
      await checkAuth();
      classroom = getCurrentClassroom();
      if (!classroom) { alert('กรุณาเลือกห้องเรียน'); window.location.href = '/dashboard.html'; return; }
      initNav('health-check');

      const now = new Date();
      currentYear = now.getFullYear();
      currentMonth = now.getMonth() + 1;
      document.getElementById('yearInput').value = currentYear;
      const monthSel = document.getElementById('monthInput');
      for (let m = 1; m <= 12; m++) {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = thaiMonth(m);
        if (m === currentMonth) opt.selected = true;
        monthSel.appendChild(opt);
      }

      // Build table header
      document.getElementById('healthHead').innerHTML = `
        <tr>
          <th>#</th>
          <th>ชื่อ-สกุล</th>
          ${ITEMS.map(item => `<th>${item}</th>`).join('')}
        </tr>
      `;

      loadHealthChecks();
    }

    window.loadHealthChecks = async function() {
      currentYear = parseInt(document.getElementById('yearInput').value);
      currentMonth = parseInt(document.getElementById('monthInput').value);

      try {
        const data = await api.getHealthChecks(classroom.id, currentYear, currentMonth);
        students = data.students || [];
        renderTable();
      } catch (e) {
        showAlert(document.getElementById('alertBox'), 'โหลดไม่ได้: ' + e.message, 'danger');
      }
    };

    function renderTable() {
      const tbody = document.getElementById('healthTbody');
      document.getElementById('healthCards').innerHTML = students.map((s, i) => `
        <section class="ios-health-card"><div class="ios-health-title">${i+1}. ${s.prefix||''}${s.first_name} ${s.last_name}</div>
          ${ITEMS.map(item => `<div class="ios-health-item"><label>${item}</label><div class="ios-health-options">
            ${['', ...HEALTH_OPTIONS[item]].map(opt => `<button type="button" class="${(s.checks?.[item]||'')===opt?'active':''}" data-student="${s.id}" data-item="${encodeURIComponent(item)}" data-value="${opt}" onclick="chooseHealth(this)">${opt || 'ยังไม่ตรวจ'}</button>`).join('')}
          </div></div>`).join('')}
        </section>`).join('');
      tbody.innerHTML = students.map((s, i) => `
        <tr>
          <td>${i+1}</td>
          <td style="text-align:left">${s.prefix||''}${s.first_name} ${s.last_name}</td>
          ${ITEMS.map(item => {
            const opts = HEALTH_OPTIONS[item];
            const val = s.checks?.[item] || '';
            return `<td><select class="health-select" id="hc-${s.id}-${encodeURIComponent(item)}">
              <option value="">-</option>
              ${opts.map(o => `<option value="${o}" ${o === val ? 'selected' : ''}>${o}</option>`).join('')}
            </select></td>`;
          }).join('')}
        </tr>
      `).join('') || '<tr><td colspan="12" class="text-center text-muted py-4">ไม่มีข้อมูล</td></tr>';
    }

    window.chooseHealth = function(btn) {
      const sid = btn.dataset.student, item = decodeURIComponent(btn.dataset.item), value = btn.dataset.value;
      btn.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
      const sel = document.getElementById(`hc-${sid}-${encodeURIComponent(item)}`); if (sel) sel.value = value;
    };

    window.saveHealthChecks = async function() {
      const records = [];
      students.forEach(s => ITEMS.forEach(item => {
        const sel = document.getElementById(`hc-${s.id}-${encodeURIComponent(item)}`);
        records.push({ student_id: s.id, item, result: sel?.value || '' });
      }));

      try {
        await api.saveHealthChecks(classroom.id, currentYear, currentMonth, records);
        showAlert(document.getElementById('alertBox'), 'บันทึกผลตรวจสุขภาพสำเร็จ', 'success');
      } catch (e) {
        showAlert(document.getElementById('alertBox'), 'บันทึกไม่สำเร็จ: ' + e.message, 'danger');
      }
    };

        function signatures(ctx) {
      return [
        { role: 'ครูประจำชั้น', name: ctx.teacherName },
        { role: 'ผู้อำนวยการ' + ctx.school.name, name: ctx.school.director },
      ];
    }

    window.printReport = async function() {
      if (!students.length) { showAlert(document.getElementById('alertBox'), 'ยังไม่มีข้อมูลให้พิมพ์ กรุณากดโหลดก่อน', 'warning'); return; }
      const ctx = await getReportContext();
      const month = `${thaiMonth(currentMonth)} พ.ศ. ${buddhistYear(currentYear)}`;
      const valueOf = (s, item) => document.getElementById(`hc-${s.id}-${encodeURIComponent(item)}`)?.value || '';
      openReport({
        key: 'health',
        title: 'แบบบันทึกผลการตรวจสุขภาพนักเรียน',
        subtitle: `ชั้น${classroom.level} ประจำเดือน${month}`,
        orientation: 'landscape',
        fileName: `ตรวจสุขภาพ_${classroom.level}_${thaiMonth(currentMonth)}${buddhistYear(currentYear)}`,
        info: [`จำนวนนักเรียน ${students.length} คน`],
        table: (c) => ({
          cls: c.orient === 'portrait' ? 'dense' : '',
          colgroup: `<colgroup><col style="width:8mm"><col style="width:${c.orient === 'portrait' ? 34 : 46}mm">${ITEMS.map(() => '<col>').join('')}</colgroup>`,
          head: `<tr><th>ที่</th><th>ชื่อ-สกุล</th>${ITEMS.map(i => `<th>${esc(i)}</th>`).join('')}</tr>`,
          rows: students.map((s, i) => `<tr class="rpt-row"><td>${i + 1}</td><td class="l">${studentName(s)}</td>${ITEMS.map(item => `<td>${esc(valueOf(s, item) || '-')}</td>`).join('')}</tr>`),
        }),
        after: '<div class="rpt-note"><b>หมายเหตุ</b> เครื่องหมาย - หมายถึง ยังไม่ได้ตรวจหรือไม่ได้บันทึกผล</div>',
        signatures: signatures(ctx),
      });
    };

    init();
  </script>
</body>
</html>
